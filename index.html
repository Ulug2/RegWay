<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>RegWay AI: Regulatory Intelligence for Private Equity</title>
    <meta
      name="description"
      content="RegWay reads new rules, enforcement actions and sanctions, and shows a private equity firm only what affects it, its funds and its portfolio companies."
    />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="canonical" href="https://www.regwayai.com/" />
    <!-- How a link to the site looks when shared (LinkedIn, Slack, email,
         messages). The picture is made by `CAPTURE=og pnpm exec playwright
         test capture`; it must be an absolute address. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RegWay AI" />
    <meta property="og:url" content="https://www.regwayai.com/" />
    <meta property="og:title" content="RegWay AI: Regulatory Intelligence for Private Equity" />
    <meta
      property="og:description"
      content="RegWay reads new rules, enforcement actions and sanctions, and shows a private equity firm only what affects it, its funds and its portfolio companies."
    />
    <meta property="og:image" content="https://www.regwayai.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The RegWay landing page beside a portfolio company's list of regulatory developments." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Tells search engines the site's name is "RegWay AI". -->
    <script type="application/ld+json">
      { "@context": "https://schema.org", "@type": "WebSite", "name": "RegWay AI", "alternateName": "RegWay", "url": "https://www.regwayai.com/" }
    </script>
    <script>
      // The theme, before anything paints (see src/lib/theme.ts).
      try {
        var choice = localStorage.getItem('regway:theme')
        var dark = choice === 'dark' || (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0D0D0D')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
