name: Nightly browsers

# Every pull request runs the browser tests in desktop Chrome (ci.yml). Once
# a night, the same tests also run in Safari's engine (WebKit) on a desktop
# and on an iPhone-sized screen, which catch layout and engine differences
# without slowing every pull request. A failure here does not block merging;
# GitHub emails whoever last edited this file, and the run's traces show
# what broke. Run it by hand from the Actions tab ("Run workflow").
#
# Like ci.yml: a mock backend, no real Supabase project, no AI calls, no
# secrets.

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC, every day
  workflow_dispatch:

concurrency:
  group: nightly-browsers
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Browser tests (WebKit, phone)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Both projects use WebKit (the phone is an iPhone 14).
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm exec playwright test --project=webkit --project=phone
        env:
          ALL_BROWSERS: '1'
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-nightly
          path: test-results/
          retention-days: 7
