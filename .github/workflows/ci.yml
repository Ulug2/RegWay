name: CI

# Runs on every pull request and on every push to main. None of these steps
# reaches a real Supabase project or makes an AI call: unit tests use a fake
# database client, browser tests use a mock backend (see README, "Tests").
# No secrets are needed, and none should be added to this workflow.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A migration that has been applied to a database must never change:
      # the database would no longer match the files. Fix a mistake with a
      # new, higher-numbered migration (CONTRIBUTING.md, "Database changes").
      - name: Existing migrations are not edited
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-status "origin/${{ github.base_ref }}...HEAD" -- supabase/migrations | grep -v '^A' || true)
          if [ -n "$changed" ]; then
            echo "These existing migrations were edited, renamed or deleted:"
            echo "$changed"
            echo "Add a new migration instead."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm typecheck:functions
      - run: pnpm test
      - run: pnpm build

  # The browser tests take several minutes and test only what runs in the
  # browser, so a pull request that changes nothing there skips them. A job
  # skipped this way still counts as passed for branch protection.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.diff.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | grep -qE '^(src/|tests/e2e/|public/|index\.html$|package\.json$|pnpm-lock\.yaml$|vite\.config\.ts$|playwright\.config\.ts$|tsconfig\.json$|\.github/workflows/)'; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
          else
            echo "browser=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: Browser tests
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
